server:
  port: 8081

spring:
  application:
    name: btl-digital-backend

  datasource:
    url: jdbc:h2:mem:btldigital;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 2

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

app:
  backend-public-url: http://localhost:8081
  security:
    reset-token-expiration: 15

brevo:
  api-key: ${BREVO_API_KEY:}

jwt:
  secret: ${JWT_SECRET:this-is-a-long-insecure-mock-secret-for-dev-00000000}
  expiration: 900000

management:
  endpoints:
    web:
      exposure:
        include: health
